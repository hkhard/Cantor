name: core

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: core (self-hosted macOS arm64)
    runs-on: [self-hosted, macOS, ARM64, cantor]
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
      # Private forScore samples on the runner machine (git-ignored, never committed).
      CANTOR_SAMPLES: /Users/hkh/dev/musicMaker/scores
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain on PATH
        run: |
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          echo "/opt/homebrew/bin" >> "$GITHUB_PATH"
      - run: rustup show active-toolchain && cargo --version
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: App backend (fmt, clippy, tests incl. M4A export)
        working-directory: app/src-tauri
        run: |
          mkdir -p ../ui/dist && [ -f ../ui/dist/index.html ] || echo '<!doctype html>' > ../ui/dist/index.html
          # Bundled sample scores are git-ignored (private); the bundle
          # needs the folder to exist.
          mkdir -p resources/scores
          cargo fmt --check
          cargo clippy -- -D warnings
          cargo test --lib
      - name: Docs point at files that exist
        run: python3 tools/check_docs.py
      - name: Dependency licences (AGPL client, app store permission)
        run: |
          python3 tools/licenses.py --self-test
          (cd app/ui && npm ci --silent)
          python3 tools/licenses.py --report "$RUNNER_TEMP/notices.md"
          diff -q <(tail -n +11 THIRD_PARTY_NOTICES.md) <(tail -n +11 "$RUNNER_TEMP/notices.md") || { echo "THIRD_PARTY_NOTICES.md is out of date: run tools/licenses.py --report THIRD_PARTY_NOTICES.md"; exit 1; }
      - name: Traceability (NFR-11)
        run: bash tools/trace.sh
      - name: Coverage >= 85% per core crate (NFR-11)
        run: bash tools/coverage.sh

  ui:
    name: UI acceptance + accessibility (WebKit, iPad mini size)
    runs-on: [self-hosted, macOS, ARM64, cantor]
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain on PATH
        run: echo "/opt/homebrew/bin" >> "$GITHUB_PATH"
      - name: Private sample scores (git-ignored, on the runner only)
        run: ln -sfn /Users/hkh/dev/musicMaker/scores scores
      - run: npm ci
        working-directory: app/ui
      - run: npx svelte-check --threshold error || true
        working-directory: app/ui
      - run: npm run build
        working-directory: app/ui
      - name: Feature scenarios and NFR-08 audit
        run: OUT="$RUNNER_TEMP/cantor-ui" bash tools/ui_harness/run.sh all
      # Screenshots stay on the runner ($RUNNER_TEMP/cantor-ui/shots): they show
      # private scores, so they are not uploaded as artifacts.

  # Linux / Windows / iOS simulator / Android emulator jobs (WP-0.2) are added
  # when a runner for them exists or when hosted minutes are wanted again.
