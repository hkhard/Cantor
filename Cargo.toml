[workspace]
resolver = "2"
members = ["crates/*"]
# The Tauri app has its own workspace (it needs the built UI at compile time).
exclude = ["app/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"

[workspace.dependencies]
cantor-score = { path = "crates/score" }
cantor-timeline = { path = "crates/timeline" }
quick-xml = "0.37"
thiserror = "2"
