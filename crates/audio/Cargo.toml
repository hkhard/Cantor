[package]
name = "cantor-audio"
description = "Scheduler, synth, mixer, offline render"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
cantor-score.workspace = true
cantor-timeline.workspace = true
rustysynth = "1.3"
symphonia = { version = "0.6.1", default-features = false, features = ["mp3", "aac", "isomp4", "flac", "wav", "pcm"] }

[dev-dependencies]
hound = "3.5"
