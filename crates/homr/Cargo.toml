[package]
name = "cantor-homr"
description = "On-device note recognition: a Rust port of homr (https://github.com/liebharc/homr)"
version.workspace = true
edition.workspace = true
# homr is AGPL-3.0. This crate is a port (a derivative work) and stays
# AGPL-3.0-only WITHOUT the app store permission in LICENSE-EXCEPTIONS.md.
license = "AGPL-3.0-only"

[dependencies]
# ONNX Runtime. Same version as the iPad spike (tools/omr/spike/).
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "half", "coreml", "api-31", "ndarray"] }
half = "2"
ndarray = "0.16"
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = { workspace = true }

[features]
# Download prebuilt ONNX Runtime for host tests (macOS/Linux). The iOS app
# links Microsoft's static xcframework instead (see crates/homr/README.md).
download = ["ort/download-binaries", "ort/copy-dylibs"]

[dev-dependencies]
