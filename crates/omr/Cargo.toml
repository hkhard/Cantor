[package]
name = "cantor-omr"
description = "PDF to MusicXML via optical music recognition (Audiveris), then MIDI"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
cantor-score.workspace = true
cantor-timeline.workspace = true
cantor-library = { path = "../library" }
thiserror.workspace = true
quick-xml.workspace = true
serde = { version = "1", features = ["derive"] }
zip = { version = "9", default-features = false, features = ["deflate"] }

[dev-dependencies]
serde_json = "1"
zip = { version = "9", default-features = false, features = ["deflate"] }

[[bin]]
name = "cantor-omr"
path = "src/main.rs"
