[package]
name = "cantor-library"
description = "SQLite library, setlists, sync, backup, forScore import"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
cantor-score.workspace = true
flate2 = "1.1"
plist = "1.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
zip = { version = "9", default-features = false, features = ["deflate"] }
thiserror.workspace = true
unicode-normalization = "0.1"

[dev-dependencies]
cantor-score.workspace = true
plist = "1.10"
flate2 = "1.1"
