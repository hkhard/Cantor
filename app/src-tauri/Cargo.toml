[package]
name = "cantor-app"
version = "0.1.0"
description = "Cantor score reader"
edition = "2021"
license = "AGPL-3.0-only"
rust-version = "1.85"

[workspace]

[lib]
name = "cantor_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
cantor-score = { path = "../../crates/score" }
cantor-timeline = { path = "../../crates/timeline" }
cantor-audio = { path = "../../crates/audio" }
cantor-lyrics = { path = "../../crates/lyrics" }
cantor-library = { path = "../../crates/library" }
cantor-annotations = { path = "../../crates/annotations" }
cantor-sync = { path = "../../crates/sync" }
cantor-ocr = { path = "../../crates/ocr" }
cpal = "0.18"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
tauri = { version = "2", features = [] }
url = "2"
tauri-plugin-log = "2"

[target.'cfg(any(target_os = "ios", target_os = "macos"))'.dependencies]
cantor-homr = { path = "../../crates/homr", optional = true, default-features = false }
libc = { version = "0.2", optional = true }
# LIB-10: render PDF pages for on-device note recognition.
objc2-core-graphics = { version = "0.3", default-features = false, features = ["std", "CGBitmapContext", "CGColorSpace", "CGContext", "CGImage", "CGDataProvider", "CGPDFDocument", "CGPDFPage"] }
objc2-core-foundation = { version = "0.3", features = ["CFData", "CFCGTypes"] }
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(target_os = "ios")'.dependencies]
objc2-user-notifications = { version = "0.3", default-features = false, features = ["std", "block2", "UNUserNotificationCenter", "UNNotificationContent", "UNNotificationRequest", "UNNotificationSound", "UNNotificationTrigger"] }
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSArray", "NSString", "NSURL", "NSDictionary", "NSValue", "NSObject", "NSData", "NSError"] }
objc2-media-player = { version = "0.3", features = ["MPRemoteCommand", "MPRemoteCommandCenter", "MPRemoteCommandEvent", "MPNowPlayingInfoCenter", "MPMediaItem", "MPMediaEntity", "block2"] }
block2 = "0.6"
objc2-ui-kit = { version = "0.3", features = ["UIActivity", "UIActivityViewController", "UIApplication", "UIPopoverPresentationController", "UIPresentationController", "UIResponder", "UIView", "UIViewController", "UIWindow", "UIDocumentPickerViewController", "objc2-core-foundation", "objc2-uniform-type-identifiers", "block2"] }
objc2-uniform-type-identifiers = { version = "0.3", features = ["UTType", "UTCoreTypes"] }

# Android: read the APK's bundled assets (android_assets.rs). Same versions as
# Tauri and cpal already pull in, so nothing new is compiled.
[target.'cfg(target_os = "android")'.dependencies]
# NFR-01: `realtime` makes cpal ask AAudio for PERFORMANCE_MODE_LOW_LATENCY
# (the fast mixer). Without it Android used the deep-buffer mixer: 215 ms
# output delay on the S10 (2026-11-26).
cpal = { version = "0.18", features = ["realtime"] }
# LIB-10 (feature `homr`): note recognition, linked dynamically against
# Microsoft's libonnxruntime.so (tools/omr/homr_port/fetch_ort_android.sh).
cantor-homr = { path = "../../crates/homr", optional = true, default-features = false }
libc = { version = "0.2", optional = true }
ndk = { version = "0.9", default-features = false }
ndk-sys = "0.6"
ndk-context = "0.1"
jni = "0.21"

[features]
# LIB-10: on-device note recognition (homr port, AGPL-only crate, 129 MB of
# models in resources/homr). Off by default until the port is complete.
homr = ["dep:cantor-homr", "dep:libc"]
# Mac builds and tests: download a host ONNX Runtime (iOS links the
# xcframework from ORT_IOS_XCFWK_PATH instead, see tools/ipad.sh).
homr-host = ["homr", "cantor-homr/download"]
