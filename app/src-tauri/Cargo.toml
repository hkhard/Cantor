[package]
name = "cantor-app"
version = "0.1.0"
description = "Cantor score reader"
edition = "2021"
license = "AGPL-3.0-only"
rust-version = "1.85"

[workspace]

[lib]
name = "cantor_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
cantor-score = { path = "../../crates/score" }
cantor-timeline = { path = "../../crates/timeline" }
cantor-audio = { path = "../../crates/audio" }
cantor-lyrics = { path = "../../crates/lyrics" }
cantor-library = { path = "../../crates/library" }
cantor-annotations = { path = "../../crates/annotations" }
cantor-sync = { path = "../../crates/sync" }
cantor-ocr = { path = "../../crates/ocr" }
cpal = "0.18"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
tauri = { version = "2", features = [] }
url = "2"
tauri-plugin-log = "2"

[target.'cfg(target_os = "ios")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSArray", "NSString", "NSURL", "NSDictionary", "NSValue", "NSObject", "NSData", "NSError"] }
objc2-core-foundation = { version = "0.3", features = ["CFCGTypes"] }
objc2-media-player = { version = "0.3", features = ["MPRemoteCommand", "MPRemoteCommandCenter", "MPRemoteCommandEvent", "MPNowPlayingInfoCenter", "MPMediaItem", "MPMediaEntity", "block2"] }
block2 = "0.6"
objc2-ui-kit = { version = "0.3", features = ["UIActivity", "UIActivityViewController", "UIApplication", "UIPopoverPresentationController", "UIPresentationController", "UIResponder", "UIView", "UIViewController", "UIWindow", "UIDocumentPickerViewController", "objc2-core-foundation", "objc2-uniform-type-identifiers", "block2"] }
objc2-uniform-type-identifiers = { version = "0.3", features = ["UTType", "UTCoreTypes"] }
