[package]
name = "cantor-app"
version = "0.1.0"
description = "Cantor score reader"
edition = "2021"
rust-version = "1.85"

[workspace]

[lib]
name = "cantor_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
cantor-score = { path = "../../crates/score" }
cantor-timeline = { path = "../../crates/timeline" }
cantor-audio = { path = "../../crates/audio" }
cpal = "0.18"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
tauri = { version = "2", features = [] }
tauri-plugin-log = "2"
